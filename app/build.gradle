plugins {
    id 'com.android.application'
}

android {
    namespace 'com.paulfinlay.simassigner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.paulfinlay.simassigner'
        minSdk 30
        // Deliberately not targeting the next Android release, which blocks direct contact writes.
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Fixed key committed to the repo so each new build installs over the previous one.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

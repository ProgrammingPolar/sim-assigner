name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME) with licences accepted.
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build log on failure (readable without sign-in)
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log build.log --target "$GITHUB_SHA" \
            --title "Last failed build log" --notes "Failed build ${GITHUB_SHA::7}" --prerelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimAssigner-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to the "latest" release (easy phone download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SimAssigner.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SimAssigner.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}" \
            --prerelease

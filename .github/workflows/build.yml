name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimAssigner-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to the "latest" release (easy phone download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SimAssigner.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SimAssigner.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}" \
            --prerelease
